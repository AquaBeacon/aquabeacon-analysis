<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#edf3f5;color:#183440;font:15px system-ui,"Yu Gothic",sans-serif}header{padding:20px 26px 12px;background:white;border-bottom:1px solid #ccdce2}h1{font-size:23px;margin:0 0 8px}p{line-height:1.65;margin:7px 0}.muted{color:#536c78;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px}main,aside{background:white;border:1px solid #cfdee3;border-radius:10px;padding:14px}canvas{width:100%;height:62vh;min-height:360px;display:block;touch-action:none;background:#f8fbfc;border-radius:6px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0}button,select,input[type=number]{font:inherit;border:1px solid #b4c8d1;border-radius:5px;background:white;padding:6px 9px}button{cursor:pointer}button:hover{background:#e1edf3}input[type=range]{min-width:160px;flex:1}input[type=number]{width:92px}.legend{display:flex;flex-wrap:wrap;gap:16px;font-weight:600;font-size:13px}.blue{color:#147cb2}.orange{color:#d85a16}.green{color:#229579}#status{font-variant-numeric:tabular-nums;white-space:pre-line;line-height:1.8;font-size:14px}#reference{width:100%;margin-top:12px;border-radius:6px}#mapSelect{max-width:100%}a{color:#146b91}.note{padding:10px;background:#f0f5f7;border-radius:5px}#timeline{width:100%}@media(max-width:900px){.layout{grid-template-columns:1fr}canvas{height:55vh}header{padding:16px}}
</style>
<header><h1>__TITLE__</h1><p id="description"></p><div class="legend"><span class="blue">● 親機 / 再構成カメラ</span><span class="orange">● 子機 / 入力した位置拘束</span><span class="green">― 親子間の観測線</span></div></header>
<div class="layout"><main><div class="controls" id="mapControls"><select id="mapSelect" aria-label="表示する地図"></select></div>
<canvas id="view" aria-label="回転できる三次元表示"></canvas>
<div class="controls"><button id="reset">全体</button><button id="top">上から</button><button id="side">横から</button><button id="follow">親子を拡大</button><label><input type="checkbox" id="showTracks" checked>軌跡</label><label id="allLabel"><input type="checkbox" id="showAll" checked>全時刻</label></div>
<div id="timeControls"><div class="controls"><button id="play">再生</button><label>速度 <select id="speed"><option>1</option><option selected>5</option><option>10</option><option>20</option></select>倍</label><input id="time" type="range" min="0" step="1" aria-label="時刻"><input id="timeNumber" type="number" min="0" step="0.2" aria-label="区間内秒">秒</div><p class="muted">空白の時刻も再生します。位置が欠測した子機と観測線は表示しません。</p></div>
<div class="controls" id="pointControls"><label>点の大きさ</label><input id="pointSize" type="range" min="0.5" max="7" step="0.5" value="2"><input id="pointNumber" type="number" min="0.5" max="7" step="0.5" value="2"></div>
<p class="muted">ドラッグ：回転　Shift＋ドラッグ：移動　ホイール：拡大縮小。点群は疎な再構成点で、面を補完した完成メッシュではありません。</p>
</main><aside><h2 style="font-size:17px;margin:0 0 10px">表示中のデータ</h2><div id="status"></div><img id="reference" alt="この断片に登録された子機カメラの元画像"><p class="muted" id="referenceCaption"></p><p class="note muted" id="notes"></p><div class="controls"><button id="saveSettings">表示設定を保存</button><label>設定を読込<input id="loadSettings" type="file" accept="application/json" style="display:block;width:100%;font-size:12px"></label><button id="saveImage">表示をPNG保存</button></div><p><a href="report.md">方法・座標・保存物の説明</a></p></aside></div>
<script>
'use strict';const DATA=__DATA__;const $=id=>document.getElementById(id);const canvas=$('view'),ctx=canvas.getContext('2d');
const isMap=DATA.kind==='maps';let selected=0,index=0,yaw=-.3,pitch=.8,zoom=1,pan=[0,0],drag=null,playing=false,last=0,elapsed=0,follow=false;
const finite=p=>Array.isArray(p)&&p.length===3&&p.every(Number.isFinite);const color={parent:'#147cb2',child:'#e16b24',link:'#279379',muted:'#aebfc7'};
$('description').textContent=DATA.description;$('notes').textContent=DATA.notes;$('timeControls').hidden=isMap;$('follow').hidden=isMap;$('allLabel').hidden=isMap;$('mapControls').hidden=!isMap;$('pointControls').hidden=!isMap;
if(isMap){DATA.maps.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m.label;$('mapSelect').appendChild(o);});}
else{$('time').max=DATA.times.length-1;$('timeNumber').max=DATA.times.at(-1)-DATA.times[0];index=DATA.preview_index||0;}
function active(){return isMap?DATA.maps[selected]:DATA;}
function finitePoints(){const a=active();return isMap?a.points.concat(a.cameras||[],a.priors||[]):a.parent.concat(a.child);}
let center=[0,0,0],extent=1;
function fit(){const ps=finitePoints().filter(finite);const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const p of ps)for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],p[j]);hi[j]=Math.max(hi[j],p[j]);}center=ps.length?lo.map((x,j)=>(x+hi[j])/2):[0,0,0];extent=ps.length?Math.max(...hi.map((x,j)=>x-lo[j]),1e-4):1;zoom=1;pan=[0,0];}
function project(p){let [x,y,z]=p.map((v,j)=>v-center[j]);const c=Math.cos(yaw),s=Math.sin(yaw),xx=c*x-s*y,yy=s*x+c*y,cy=Math.cos(pitch),sy=Math.sin(pitch);return [canvas.clientWidth/2+pan[0]+xx*scale(),canvas.clientHeight/2+pan[1]-(cy*yy+sy*z)*scale(),sy*yy-cy*z];}
function scale(){return Math.min(canvas.clientWidth,canvas.clientHeight)*.78/extent*zoom;}
function line(points,stroke,width=1.5){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.beginPath();let started=false;for(const p of points){if(!finite(p)){started=false;continue;}const [x,y]=project(p);if(started)ctx.lineTo(x,y);else ctx.moveTo(x,y);started=true;}ctx.stroke();}
function dot(p,fill,r=3,label=''){if(!finite(p))return;const [x,y]=project(p);ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();if(label){ctx.font='600 13px system-ui';ctx.fillText(label,x+r+5,y-6);}}
function tracks(points,segments,fill,end){for(const s of segments){line(s.filter(i=>i<=end).map(i=>points[i]),fill,1.5);} }
function draw(){const dpr=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#f8fbfc';ctx.fillRect(0,0,w,h);
const a=active();if(!isMap&&follow&&finite(a.parent[index])){center=a.parent[index].map((v,j)=>finite(a.child[index])?(v+a.child[index][j])/2:v);extent=3;}
const unit=extent>8?5:extent>2?1:extent>.3?.2:extent/5;const anchor=[Math.floor(center[0]/unit)*unit,Math.floor(center[1]/unit)*unit,isMap?center[2]:0];for(let k=-4;k<=4;k++){line([[anchor[0]-4*unit,anchor[1]+k*unit,anchor[2]],[anchor[0]+4*unit,anchor[1]+k*unit,anchor[2]]],'#dfe8eb',.7);line([[anchor[0]+k*unit,anchor[1]-4*unit,anchor[2]],[anchor[0]+k*unit,anchor[1]+4*unit,anchor[2]]],'#dfe8eb',.7);}
const axisNames=isMap&&!a.metric?['X','Y','Z']:['East','North','Up'];for(let j=0;j<3;j++){const end=[...anchor];end[j]+=unit;line([anchor,end],['#d86054','#2d9b71','#5274d2'][j],2);dot(end,'#375461',1,`${axisNames[j]} ${unit.toPrecision(2)}${a.metric||!isMap?' m':''}`);}
if(isMap){const order=a.points.map((p,i)=>[project(p),i]).sort((p,q)=>q[0][2]-p[0][2]);const radius=+$('pointSize').value;for(const [p,i] of order){ctx.fillStyle=a.colors[i]||'#357e89';ctx.fillRect(p[0]-radius/2,p[1]-radius/2,radius,radius);}if($('showTracks').checked){for(const seg of a.camera_segments||[])line(seg.map(i=>a.cameras[i]),color.parent,2);a.cameras.forEach(p=>dot(p,color.parent,2));a.priors.forEach(p=>dot(p,color.child,3));} $('status').textContent=a.caption;$('reference').hidden=!a.image;if(a.image)$('reference').src=a.image;$('referenceCaption').textContent=a.image_caption||'';
}else{const end=$('showAll').checked?a.times.length-1:index;if($('showTracks').checked){tracks(a.parent,a.parent_segments,color.parent,end);tracks(a.child,a.child_segments,color.child,end);}const p=a.parent[index],c=a.child[index];if(finite(p)&&finite(c))line([p,c],color.link,2);dot(p,color.parent,8,'親機');dot(c,color.child,8,'子機');const t=a.times[index]-a.times[0];$('time').value=index;$('timeNumber').value=t.toFixed(1);$('status').textContent=`区間内 ${t.toFixed(1)} 秒\n親動画 ${a.times[index].toFixed(1)} 秒\n親機：${finite(p)?'位置あり':'欠測'}\n子機：${finite(c)?'位置あり':'欠測'}\n音響距離：${Number.isFinite(a.range[index])?a.range[index].toFixed(3)+' m':'欠測'}\n表示：親機の高さ 0 m\n子機の高さ = −相対下向き成分`;$('reference').hidden=true;}
ctx.fillStyle='#516a76';ctx.font='12px system-ui';ctx.fillText(isMap?a.metric?'位置拘束の座標系・メートル尺度は条件付き':'単眼の任意尺度・他断片とは独立':'GNSS水平＋磁北相対位置（偏角0°の表示）',12,h-14);}
function reset(){follow=false;fit();yaw=-.3;pitch=.8;draw();} $('reset').onclick=reset;$('top').onclick=()=>{follow=false;fit();yaw=0;pitch=0;draw();};$('side').onclick=()=>{follow=false;fit();yaw=0;pitch=Math.PI/2;draw();};$('follow').onclick=()=>{follow=!follow;if(!follow)fit();draw();};$('mapSelect').onchange=()=>{selected=+$('mapSelect').value;reset();};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];if(e.shiftKey){pan[0]+=dx;pan[1]+=dy;}else{yaw+=dx*.008;pitch=Math.max(-1.55,Math.min(1.55,pitch+dy*.008));}drag=[e.clientX,e.clientY];draw();};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.1,Math.min(100,zoom*Math.exp(-e.deltaY*.001)));draw();},{passive:false});
for(const id of ['showTracks','showAll'])$(id).onchange=draw;$('pointSize').oninput=()=>{$('pointNumber').value=$('pointSize').value;draw();};$('pointNumber').oninput=()=>{const v=+$('pointNumber').value;if(!Number.isFinite(v))return;$('pointSize').value=Math.max(.5,Math.min(7,v));draw();};$('time').oninput=()=>{playing=false;$('play').textContent='再生';index=+$('time').value;elapsed=index*.2;draw();};$('timeNumber').onchange=()=>{const v=+$('timeNumber').value;if(!Number.isFinite(v))return;index=Math.max(0,Math.min(DATA.times.length-1,Math.round(v/.2)));elapsed=index*.2;draw();};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'一時停止':'再生';elapsed=index*.2;last=performance.now();};function animate(now){if(playing&&!isMap){elapsed+=(now-last)/1000*+$('speed').value;const next=Math.floor(elapsed/.2);if(next>=DATA.times.length){playing=false;index=DATA.times.length-1;$('play').textContent='再生';}else index=next;draw();}last=now;requestAnimationFrame(animate);}requestAnimationFrame(animate);
function download(body,type,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);} $('saveSettings').onclick=()=>download(JSON.stringify({yaw,pitch,zoom,pan,center,extent,selected,index,follow,pointSize:+$('pointSize').value},null,2),'application/json','ngt-view-settings.json');$('loadSettings').onchange=async e=>{const s=JSON.parse(await e.target.files[0].text());for(const k of ['yaw','pitch','zoom','extent','index','selected','pointSize'])if(!Number.isFinite(s[k]))throw Error('設定値が不正です');yaw=s.yaw;pitch=s.pitch;zoom=s.zoom;pan=s.pan;center=s.center;extent=s.extent;selected=Math.max(0,Math.min((DATA.maps||[0]).length-1,s.selected));index=Math.max(0,Math.min((DATA.times||[0]).length-1,s.index));follow=!!s.follow;$('mapSelect').value=selected;$('pointSize').value=s.pointSize;$('pointNumber').value=s.pointSize;draw();};$('saveImage').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='ngt-3d-view.png';a.click();};window.addEventListener('resize',draw);fit();draw();window.NGT_VIEWER={data:DATA,draw,getState:()=>({selected,index,playing,follow})};
</script></html>
